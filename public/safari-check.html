<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bodolvo loading check</title><style>body{background:#090b0f;color:#fff;font:16px -apple-system,BlinkMacSystemFont,Arial,sans-serif;padding:28px}pre{white-space:pre-wrap;color:#b4c9df}</style></head><body><h1>Bodolvo loading check</h1><p>If this page appears instantly but the homepage waits, the delay may involve the homepage or Next.js resources. If both wait, investigate Safari request timing or content blockers.</p><pre id="timing">Loading timing…</pre><script>addEventListener('load',function(){setTimeout(function(){var n=performance.getEntriesByType('navigation')[0];if(!n)return;document.getElementById('timing').textContent=['DNS: '+(n.domainLookupEnd-n.domainLookupStart).toFixed(0)+' ms','Connection: '+(n.connectEnd-n.connectStart).toFixed(0)+' ms','Wait for response: '+(n.responseStart-n.requestStart).toFixed(0)+' ms','Download: '+(n.responseEnd-n.responseStart).toFixed(0)+' ms','DOMContentLoaded: '+n.domContentLoadedEventEnd.toFixed(0)+' ms','Load: '+n.loadEventEnd.toFixed(0)+' ms'].join('\n')},0)})</script></body></html>
